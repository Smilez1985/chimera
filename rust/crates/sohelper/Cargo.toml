[package]
name = "chimera-sohelper"
description = "Ausfuehrer: prueft und fuehrt die Werkzeuge des Agenten aus (DESIGN, Regel 'Wer prueft, fuehrt aus')"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "sohelper"
path = "src/lib.rs"

[[bin]]
name = "chimera-sohelper"
path = "src/main.rs"

# Der kleine Helfer fuer `ProxyUseFdpass`: er gibt den geerbten Deskriptor als
# Zeile "fd <n>" aus und oeffnet selbst nichts (DESIGN, Fernausfuehrung).
[[bin]]
name = "chimera-fdpass"
path = "src/fdpass_main.rs"

[dependencies]
serde_json.workspace = true
gemein.workspace = true
libc.workspace = true
