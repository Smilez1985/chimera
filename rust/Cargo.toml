# Chimera -- Rust-Teil (DESIGN Regel 14).
#
# Ein Workspace fuer alles, was dauernd laeuft und nicht auf das Modell
# wartet: Gateway (chimera-tor), spaeter Briefkasten, Sitzungsablage,
# Root-Helfer und Renderer. Gemeinsames liegt in `gemein`.
#
# Gebaut wird nie auf dem Geraet, sondern in der CI fuer
# aarch64-unknown-linux-musl (statisch). Die Versionsnummer der Binaries
# kommt aus der VERSION-Datei im Repo-Root, nicht aus diesen Manifesten.

[workspace]
resolver = "2"
members = ["crates/gemein", "crates/tor"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1"
# Nur Klartext-HTTP (Ollama im LAN). TLS kommt mit den Cloud-Anbietern.
ureq = { version = "3", default-features = false, features = ["json"] }
gemein = { path = "crates/gemein" }

# Regel 14: klein und ohne Abwickeln. `panic = "abort"` heisst, ein Panik
# beendet den Prozess sofort, systemd startet ihn neu (Regel 10p).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
