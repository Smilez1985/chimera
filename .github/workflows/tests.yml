name: Tests

# Warum CI, obwohl jeder Lauf hier auch von Hand geht:
#
# Die Tests dieses Projekts sind eigenstaendige Laeufer, die von Hand
# gestartet werden. Das funktioniert -- solange jemand daran denkt. Genau
# das ist beim Registry-Fehler und beim Renderer-Startbefehl schiefgegangen:
# Die Tests waren gruen, aber niemand hatte den einen Zweig aufgerufen.
#
# CI nimmt das "daran denken" aus der Gleichung. Und sie prueft auf einer
# ANDEREN Shell als der Entwicklungsumgebung: hier BusyBox ash, dort dash.
# Beide unterscheiden sich von bash, aber nicht gleich -- was auf einer
# laeuft, muss auf der anderen nicht laufen.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 ist die aelteste Fassung, die Chimera unterstuetzt.
        # 3.13 laeuft auf dem Zielgeraet (DietPi/Trixie) -- das ist die
        # Fassung, die zaehlt.
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Abhaengigkeiten
        # Nur was die Tests wirklich brauchen. Chimera selbst kommt ohne
        # Fremdbibliotheken aus; Pillow und numpy braucht der Renderer.
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy

      - name: Tests
        # Die Testdateien sind eigenstaendige Laeufer mit eigenem Exitcode,
        # kein pytest. Jede wird einzeln aufgerufen, damit ein Fehlschlag
        # nicht die uebrigen verdeckt.
        run: |
          set -eu
          fehl=0
          for t in tests/test_*.py; do
            printf '=== %s ===\n' "$t"
            if PYTHONPATH=src python3 "$t"; then :; else
              fehl=$((fehl + 1))
              printf 'ROT: %s\n' "$t"
            fi
          done
          [ "$fehl" -eq 0 ] || { printf '\n%d Testdatei(en) rot.\n' "$fehl"; exit 1; }

      - name: Ungebundene Namen
        # Findet Namen, die eine Funktion als global liest, die es nicht
        # gibt. Diese Fehlerklasse uebersehen Tests strukturell: Sie faellt
        # erst auf, wenn der Zweig betreten wird.
        run: python3 tools/check-globals.py src/ tests/ tools/

  installer:
    name: Installer (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Zwei Shells, weil die Zielgeraete verschiedene haben und beide
        # NICHT bash sind. BusyBox ist die strengste -- was dort laeuft,
        # laeuft fast ueberall.
        shell: [dash, busybox]

    steps:
      - uses: actions/checkout@v4

      - name: Shell bereitstellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dash busybox-static

      - name: Tests
        # Als root, wie der Installer am Geraet und die Entwicklung lokal.
        # Mehrere Schritte verlangen `id -u` = 0. Als Nutzer `runner`
        # brachen sie mit "nur als Verwalter" ab (Lauf 38828905149).
        run: |
          set -eu
          cd installer
          case "${{ matrix.shell }}" in
            dash)    SH="sudo -E dash" ;;
            busybox) SH="sudo -E busybox sh" ;;
          esac
          fehl=0
          for t in tests/test-*.sh; do
            printf '=== %s (%s) ===\n' "$t" "$SH"
            if $SH "$t"; then :; else
              fehl=$((fehl + 1))
              printf 'ROT: %s\n' "$t"
            fi
          done
          [ "$fehl" -eq 0 ] || { printf '\n%d Testdatei(en) rot.\n' "$fehl"; exit 1; }

      - name: Syntax aller Skripte
        # Ein Syntaxfehler in einem Modul, das kein Test aufruft, faellt
        # sonst erst auf dem Geraet auf.
        run: |
          set -eu
          case "${{ matrix.shell }}" in
            dash)    SH="dash" ;;
            busybox) SH="busybox sh" ;;
          esac
          find installer -name '*.sh' -o -name 'chimera-install' | while read -r f; do
            $SH -n "$f" || { printf 'Syntaxfehler: %s\n' "$f"; exit 1; }
          done

  rust:
    name: Rust (aarch64-musl)
    # Nativer arm64-Runner: Tests laufen auf der Architektur des Ziels,
    # und das gebaute Binary wird hier auch ausgefuehrt -- ein Artefakt,
    # das nie gestartet wurde, ist eine Behauptung (DESIGN Regel 14).
    runs-on: ubuntu-24.04-arm
    # Nur dieser Job darf schreiben: er veroeffentlicht das Pre-Alpha-
    # Binary als Prerelease (anonym ladbar, Artefakte sind es nicht).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rust
    env:
      ZIEL: aarch64-unknown-linux-musl
      # cargo-deny als Release-Binary, an Version UND Pruefsumme gebunden
      # (GLOBAL: Pruefsumme vor dem Ausfuehren).
      DENY_V: "0.20.2"
      DENY_SHA: 995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeugkette
        run: |
          set -eu
          rustup toolchain install stable --profile minimal
          rustup target add "$ZIEL"
          # musl-gcc fuer Crates mit C-Anteil (spaeter ring ueber rustls).
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustc --version; cargo --version

      - name: Tests
        run: cargo test --locked --target "$ZIEL"

      - name: Lizenzen und Schwachstellen (cargo deny)
        run: |
          set -eu
          d="cargo-deny-${DENY_V}-aarch64-unknown-linux-musl"
          curl -fsSL -o /tmp/deny.tgz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_V}/${d}.tar.gz"
          echo "${DENY_SHA}  /tmp/deny.tgz" | sha256sum -c -
          tar -xzf /tmp/deny.tgz -C /tmp
          /tmp/"$d"/cargo-deny --version
          /tmp/"$d"/cargo-deny check

      - name: Release-Build
        run: cargo build --release --locked --target "$ZIEL"

      - name: Binary pruefen und Pruefsumme
        # Statisch heisst: kein Interpreter-Eintrag. Und das Binary muss
        # laufen und die Version aus VERSION nennen, nicht irgendeine.
        run: |
          set -eu
          b="target/$ZIEL/release/chimera-tor"
          file "$b"
          file "$b" | grep -q 'statically linked' || { echo "nicht statisch gelinkt"; exit 1; }
          soll="$(tr -d ' \t\r\n' < ../VERSION)"
          ist="$("$b" --version)"
          [ "$ist" = "chimera-tor $soll" ] || { echo "Version: '$ist' statt '$soll'"; exit 1; }
          "$b" --pruefen
          mkdir -p ../ausgabe
          cp "$b" ../ausgabe/chimera-tor-aarch64
          cd ../ausgabe && sha256sum chimera-tor-aarch64 > chimera-tor-aarch64.sha256
          cat chimera-tor-aarch64.sha256
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: chimera-rust-aarch64-${{ github.sha }}
          path: ausgabe/
          if-no-files-found: error

      - name: Prerelease rust-<commit> (nur entwicklung, kein Versions-Tag)
        # Der Installer holt das Binary ohne Anmeldung (DESIGN 14). Das Tag
        # heisst rust-<kurzer commit>, nie vX.Y.Z: Pre-Alpha bleibt ungetaggt
        # im Sinne der Release-Kanaele. Gleicher Commit = gleicher Name,
        # ein erneuter Lauf ersetzt die Dateien, nicht das Tag.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/entwicklung'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="rust-$(echo "$GITHUB_SHA" | cut -c1-7)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ../ausgabe/* --clobber
          else
            gh release create "$tag" ../ausgabe/* --prerelease \
              --target "$GITHUB_SHA" --title "$tag" \
              --notes "Pre-Alpha-Build von $GITHUB_SHA (aarch64-musl, statisch). Pruefsumme in chimera-tor-aarch64.sha256."
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'

  trockenlauf:
    name: Trockenlauf ohne Hardware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Erfundenes Wurzelverzeichnis
        # Regel 10d: Alles Lesende geht ueber CHIMERA_ROOT. Genau dafuer
        # ist sie da -- die Boarderkennung laesst sich ohne Zielhardware
        # pruefen, indem man ihr erfundene Systemdateien vorlegt.
        run: |
          set -eu
          R="$(mktemp -d)"
          mkdir -p "$R/proc/device-tree" "$R/etc" "$R/boot/firmware"
          printf 'Raspberry Pi Zero 2 W Rev 1.0\0' >"$R/proc/device-tree/model"
          printf 'raspberrypi,model-zero-2-w\0brcm,bcm2837\0' \
            >"$R/proc/device-tree/compatible"
          printf 'ID=debian\nVERSION_CODENAME=trixie\n' >"$R/etc/os-release"
          : >"$R/boot/firmware/config.txt"
          echo "CHIMERA_ROOT=$R" >>"$GITHUB_ENV"

      - name: Preflight erkennt das Board
        run: |
          set -eu
          cd installer
          CHIMERA_MODE=check CHIMERA_LOG_DIR=/tmp/logs \
            sh steps/10-check-system.sh
          # Exitcode 0 heisst: erkannt und unterstuetzt. Alles andere ist
          # ein Befund -- auch dann, wenn das Skript nicht abstuerzt.

      - name: Trockenlauf aendert nichts
        run: |
          set -eu
          cd installer
          vorher="$(cat "$CHIMERA_ROOT/boot/firmware/config.txt")"
          CHIMERA_MODE=dry CHIMERA_ANZEIGE=whisplay CHIMERA_LOG_DIR=/tmp/logs \
            sh steps/40-install-display.sh || true
          nachher="$(cat "$CHIMERA_ROOT/boot/firmware/config.txt")"
          if [ "$vorher" != "$nachher" ]; then
            echo "Der Trockenlauf hat die Bootkonfiguration veraendert."
            diff <(printf '%s' "$vorher") <(printf '%s' "$nachher") || true
            exit 1
          fi
          echo "Bootkonfiguration unveraendert — richtig."
          # Und: keine Sicherung. Eine Sicherung im Trockenlauf waere
          # selbst eine Aenderung.
          if ls "$CHIMERA_ROOT/boot/firmware/"*.bak >/dev/null 2>&1; then
            echo "Der Trockenlauf hat eine Sicherung angelegt."
            exit 1
          fi
          echo "Keine Sicherung angelegt — richtig."

      - name: Rueckbau laeuft und raeumt nur Eigenes weg
        # Der eigentliche Nachweis des Manifests: Ohne einen Leser ist
        # jeder Eintrag eine unbelegte Behauptung (Regel 10l).
        run: |
          set -eu
          R="$CHIMERA_ROOT"
          mkdir -p "$R/var/lib/chimera" "$R/var/log/chimera"
          printf '# vom Nutzer\ndtparam=watchdog=on\n' \
            >"$R/boot/firmware/config.txt"

          # Eintragen wie der Installer: eine fremde Zeile als vorher_da,
          # eine eigene als neu.
          CHIMERA_ROOT="$R" \
          CHIMERA_MANIFEST="$R/var/lib/chimera/manifest.tsv" \
          CHIMERA_LOG_DIR="$R/var/log/chimera" \
          CHIMERA_STEP=ci sh -c '
            . installer/lib/common.sh
            . installer/lib/manifest.sh
            manifest_line "$CHIMERA_ROOT/boot/firmware/config.txt" \
              "dtparam=watchdog=on" >/dev/null
            manifest_line "$CHIMERA_ROOT/boot/firmware/config.txt" \
              "dtparam=spi=on" >/dev/null'

          CHIMERA_ROOT="$R" \
          CHIMERA_MANIFEST="$R/var/lib/chimera/manifest.tsv" \
          CHIMERA_LOG_DIR="$R/var/log/chimera" \
            sh uninstaller/chimera-uninstall

          cfg="$R/boot/firmware/config.txt"
          if grep -q '^dtparam=spi=on$' "$cfg"; then
            echo "Die eigene Zeile steht noch da — der Rueckbau wirkt nicht."
            exit 1
          fi
          if ! grep -q '^dtparam=watchdog=on$' "$cfg"; then
            echo "FREMDE Zeile entfernt — der Rueckbau greift zu weit."
            exit 1
          fi
          echo "Eigenes entfernt, Fremdes stehen gelassen — richtig."

      - name: Rueckbau ohne Manifest bricht nicht ab
        # Regel 10n: nachsehen, nicht abbrechen und nicht raten. Ohne
        # Manifest ist die Herkunft unbekannt, die Anwesenheit nicht --
        # also wird berichtet und die Bootkonfiguration NICHT angefasst.
        run: |
          set -eu
          R="$(mktemp -d)"
          mkdir -p "$R/boot/firmware" "$R/var/log/chimera" "$R/opt/chimera"
          printf '# vom Nutzer\ndtparam=spi=on\n' >"$R/boot/firmware/config.txt"
          vorher="$(cat "$R/boot/firmware/config.txt")"

          CHIMERA_ROOT="$R" \
          CHIMERA_LOG_DIR="$R/var/log/chimera" \
          CHIMERA_MANIFEST="$R/gibt-es-nicht.tsv" \
            sh uninstaller/chimera-uninstall >/tmp/ohne.log 2>&1

          grep -q 'Kein Manifest' /tmp/ohne.log || {
            echo "Das fehlende Manifest wurde nicht benannt."; exit 1; }
          grep -q 'opt/chimera' /tmp/ohne.log || {
            echo "Es wurde nicht nachgesehen."; exit 1; }
          nachher="$(cat "$R/boot/firmware/config.txt")"
          [ "$vorher" = "$nachher" ] || {
            echo "Bootkonfiguration veraendert, obwohl Herkunft unbekannt."
            exit 1; }
          echo "Nachgesehen, berichtet, nichts geraten — richtig."

          # Regel 10o: ein Fund ohne Manifesteintrag wird NICHT entfernt,
          # auch wenn der Name auf Chimera hindeutet. Der Name ist ein
          # Indiz, kein Beleg — dort kann ein Einhaengepunkt liegen.
          [ -d "$R/opt/chimera" ] || {
            echo "Regel 10o verletzt: /opt/chimera ohne Beleg entfernt."
            exit 1; }
          echo "Fund ohne Manifesteintrag unangetastet — richtig."
