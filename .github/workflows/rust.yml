name: Rust

# Warum ein eigener Workflow (Vorgabe smilez, 4.11.): Der Rust-Job baut auf
# einem arm64-Runner und veroeffentlicht ein Prerelease -- beides kostet
# Minuten und Token. Bei einem reinen Doku-Commit aendert sich am Binary
# nichts, das Ergebnis ist also im Voraus bekannt: Modul 55 haelt still,
# solange `state/rust-stand` (Commit, Hash des rust/-Baums, Version) passt.
#
# Deshalb laeuft dieser Workflow nur, wenn sich `rust/` oder `VERSION`
# geaendert hat. Die Auswahl trifft GitHub vor dem Start des Runners -- ein
# Vorschalt-Job in tests.yml haette den Runner schon bezahlt.
#
# `VERSION` gehoert dazu: Das Binary traegt seine Version im Namen
# (`chimera-tor <VERSION>`), und eine neue VERSION hebt die Stillhalte-Regel
# in Modul 55 auf -- dann wird ein neues Binary gebraucht.
#
# `workflow_dispatch` ignoriert Pfadfilter: Von Hand laesst sich der Job
# jederzeit anstossen -- mit oder ohne Prerelease.
#
# Seit 11.11.2026 ist das Prerelease AUS (smilez): Der Installer nimmt das
# Binary aus `gateway/`, das im Repo liegt. Gebaut und geprueft wird bei
# jeder Aenderung an `rust/` weiter; veroeffentlicht nur auf Wunsch
# (`workflow_dispatch` mit `prerelease: true`), wenn es zum Testen gebraucht
# wird.

on:
  push:
    branches: [main, entwicklung]
    paths:
      - 'rust/**'
      - 'VERSION'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'VERSION'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Prerelease rust-<commit> veroeffentlichen (nur zum Testen)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rust:
    name: Rust (aarch64-musl)
    # Nativer arm64-Runner: Tests laufen auf der Architektur des Ziels,
    # und das gebaute Binary wird hier auch ausgefuehrt -- ein Artefakt,
    # das nie gestartet wurde, ist eine Behauptung (DESIGN Regel 14).
    runs-on: ubuntu-24.04-arm
    # Schreiben nur, wenn ein Prerelease veroeffentlicht wird (auf Wunsch,
    # siehe oben). Der Schritt haengt an derselben Bedingung.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rust
    env:
      ZIEL: aarch64-unknown-linux-musl
      # cargo-deny als Release-Binary, an Version UND Pruefsumme gebunden
      # (GLOBAL: Pruefsumme vor dem Ausfuehren).
      DENY_V: "0.20.2"
      DENY_SHA: 995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeugkette
        run: |
          set -eu
          rustup toolchain install stable --profile minimal
          rustup target add "$ZIEL"
          # musl-gcc fuer Crates mit C-Anteil (spaeter ring ueber rustls).
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustc --version; cargo --version

      - name: Tests
        run: cargo test --locked --target "$ZIEL"

      - name: Gleichheit Python <-> Ausfuehrer
        # Zwei Umsetzungen derselben Regeln (agent/safety.py und
        # rust/crates/sohelper) muessen dasselbe Urteil und denselben Text
        # liefern. Der Test startet den Ausfuehrer und schickt dieselben
        # Faelle durch beide Seiten. Er laeuft HIER, weil der Runner arm64
        # ist und das gebaute Binary ausfuehren kann -- auf x86 waere es
        # "Exec format error" (derselbe Test ueberspringt dort und sagt es).
        run: |
          set -eu
          CHIMERA_SOHELPER_BIN="$PWD/target/$ZIEL/release/chimera-sohelper" \
            python3 ../tests/test_sohelper_gleichheit.py

      - name: Lizenzen und Schwachstellen (cargo deny)
        run: |
          set -eu
          d="cargo-deny-${DENY_V}-aarch64-unknown-linux-musl"
          curl -fsSL -o /tmp/deny.tgz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_V}/${d}.tar.gz"
          echo "${DENY_SHA}  /tmp/deny.tgz" | sha256sum -c -
          tar -xzf /tmp/deny.tgz -C /tmp
          /tmp/"$d"/cargo-deny --version
          /tmp/"$d"/cargo-deny check

      - name: Release-Build
        run: cargo build --release --locked --target "$ZIEL"

      - name: Binary pruefen und Pruefsumme
        # Statisch heisst: kein Interpreter-Eintrag. Und das Binary muss
        # laufen und die Version aus VERSION nennen, nicht irgendeine.
        # Beide Programme des Workspace, die im Repo liegen (Regel 14,
        # "Binary im Repo"): Gateway und Ausfuehrer.
        run: |
          set -eu
          soll="$(tr -d ' \t\r\n' < ../VERSION)"
          mkdir -p ../ausgabe
          for pa in chimera-tor:chimera-tor-aarch64 chimera-sohelper:chimera-sohelper-aarch64; do
            prog="${pa%%:*}"; asset="${pa##*:}"
            b="target/$ZIEL/release/$prog"
            file "$b"
            file "$b" | grep -q 'statically linked' || { echo "$prog: nicht statisch gelinkt"; exit 1; }
            ist="$("$b" --version)"
            [ "$ist" = "$prog $soll" ] || { echo "$prog: Version '$ist' statt '$prog $soll'"; exit 1; }
            cp "$b" "../ausgabe/$asset"
            ( cd ../ausgabe && sha256sum "$asset" > "$asset.sha256" )
            cat "../ausgabe/$asset.sha256"
          done
          "target/$ZIEL/release/chimera-tor" --pruefen
          ls -l ../ausgabe

      - uses: actions/upload-artifact@v4
        with:
          name: chimera-rust-aarch64-${{ github.sha }}
          path: ausgabe/
          if-no-files-found: error

      - name: Prerelease rust-<commit> (nur auf Wunsch)
        # Der Installer nimmt das Binary aus `gateway/` im Repo (DESIGN 14);
        # ein Prerelease braucht er nicht mehr. Veröffentlicht wird nur, wenn
        # es zum Testen angefordert wird -- von Hand mit `prerelease: true`.
        #
        # Das Tag heisst rust-<kurzer commit>, nie vX.Y.Z: Pre-Alpha bleibt
        # ungetaggt im Sinne der Release-Kanaele. Gleicher Commit = gleicher
        # Name, ein erneuter Lauf ersetzt die Dateien, nicht das Tag.
        if: github.event_name == 'workflow_dispatch' && inputs.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="rust-$(echo "$GITHUB_SHA" | cut -c1-7)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ../ausgabe/* --clobber
          else
            gh release create "$tag" ../ausgabe/* --prerelease \
              --target "$GITHUB_SHA" --title "$tag" \
              --notes "Pre-Alpha-Build von $GITHUB_SHA (aarch64-musl, statisch). Pruefsumme in chimera-tor-aarch64.sha256."
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'

